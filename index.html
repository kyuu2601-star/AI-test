<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dalat Travel OS - Chat Box Sandbox</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="p-4 md:p-10 flex items-center justify-center min-h-screen">

    <div class="max-w-2xl w-full mx-auto space-y-6">
        <header class="text-center space-y-1">
            <h1 class="text-3xl font-extrabold text-white tracking-tighter italic uppercase">
                TRAVEL <span class="text-amber-500 font-light italic">OS</span>
            </h1>
            <p class="text-slate-500 text-[10px] uppercase tracking-[0.4em] font-black italic">
                CHAT BOX ONLY - PROMPT TESTING GROUND
            </p>
        </header>

        <div class="glass-panel rounded-[2.5rem] border border-amber-500/10 shadow-2xl flex flex-col h-[550px] overflow-hidden">
            
            <div class="bg-slate-900/50 px-6 py-4 border-b border-white/5 flex items-center gap-3">
                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_#10b981]"></div>
                <span class="text-xs font-black uppercase tracking-widest text-slate-300">Thổ Địa Chát Chít Sandbox</span>
            </div>

            <div id="chat-box" class="flex-1 p-6 overflow-y-auto flex flex-col">
                </div>

            <div class="p-4 bg-slate-900/30 border-t border-white/5 flex gap-3">
                <input type="text" id="userInput" placeholder="Hỏi thổ địa bất cứ điều gì..." 
                       onkeydown="if(event.key === 'Enter') handleChat()"
                       class="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-5 py-4 text-sm focus:border-amber-500 outline-none transition-all text-white placeholder:text-slate-600">
                <button onclick="handleChat()" class="bg-amber-600 hover:bg-amber-500 text-white px-6 rounded-2xl text-xs font-black uppercase tracking-widest shadow-lg shadow-amber-900/20 transition-all">
                    Gửi
                </button>
            </div>
        </div>
    </div>

    <script>
        // Fake biến vị trí nền để tránh lỗi undefined khi chat.js gọi
        window.userPos = { lat: 10.7987, lon: 106.6867 }; 

        window.onload = () => {
            if (typeof initBot === "function") {
                initBot();
            }
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>

    <script src="keywords.js"></script>
    <script src="prompts.js"></script>

    <script src="config.js"></script>
    <script src="widget.js"></script>
    <script src="chat.js"></script>
</body>
</html>
