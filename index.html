<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DalatOS AI - Fix Quota</title>
    <style>
        :root { --primary: #007bff; --bg: #f4f7f6; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: var(--primary); color: white; padding: 1rem; text-align: center; font-weight: bold; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 15px; }
        .user { align-self: flex-end; background: var(--primary); color: white; }
        .ai { align-self: flex-start; background: white; border: 1px solid #ddd; }
        .input-group { background: white; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        button { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 20px; cursor: pointer; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

<div class="header">🌲 DALATOS AI (v1.5 Flash) 🌲</div>
<div id="chat-box"></div>
<div class="input-group">
    <input type="text" id="prompt" placeholder="Nhập tin nhắn...">
    <button id="sendBtn">Gửi</button>
</div>

<script>
    const API_KEY = "GEMINI_API_KEY"; 
    const chatBox = document.getElementById('chat-box');
    const input = document.getElementById('prompt');
    const btn = document.getElementById('sendBtn');

    async function handleChat() {
        const text = input.value.trim();
        if (!text || btn.disabled) return;

        addMessage('user', text);
        input.value = '';
        btn.disabled = true;

        try {
            // Hạ cấp xuống 1.5-flash để tránh lỗi "limit: 0" của bản 2.0
            const MODEL = "gemini-1.5-flash";
            const URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;

            const response = await fetch(URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message);

            const aiResponse = data.candidates[0].content.parts[0].text;
            addMessage('ai', aiResponse);
        } catch (err) {
            addMessage('ai', "⚠️ Lỗi Quota: " + err.message);
        } finally {
            btn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    function addMessage(type, content) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = content;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    btn.addEventListener('click', handleChat);
    input.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleChat(); });
</script>
</body>
</html>
