<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dalat Travel OS - Chat Box Sandbox</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #020617; color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="p-4 md:p-10 flex items-center justify-center min-h-screen">

    <!-- CHỈ GIỮ LẠI GIAO DIỆN KHUNG CHAT BOX -->
    <div class="max-w-2xl w-full mx-auto space-y-6">
        <header class="text-center space-y-1">
            <h1 class="text-3xl font-extrabold text-white tracking-tighter italic uppercase">
                TRAVEL <span class="text-amber-500 font-light italic">OS</span>
            </h1>
            <p class="text-slate-500 text-[10px] uppercase tracking-[0.4em] font-black italic">
                CHAT BOX ONLY - PROMPT TESTING GROUND
            </p>
        </header>

        <!-- Khung chứa Chat Box của fen (Giao diện này do file chat.js hoặc index kiểm soát) -->
        <div class="glass-panel p-6 rounded-[2.5rem] border border-amber-500/10 shadow-2xl min-h-[300px] flex flex-col justify-center items-center">
            <p class="text-xs text-slate-400 italic">Môi trường thử nghiệm Chat đã sẵn sàng...</p>
        </div>
    </div>

    <script>
        // Hàm kích hoạt khởi chạy Bot khi nạp trang xong
        window.onload = () => {
            if (typeof initBot === "function") {
                initBot();
            }
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>

    <!-- 🚨 GIỮ NGUYÊN 100% PHẦN ĐUÔI SRC THEO YÊU CẦU CỦA FEN -->
    <script src="config.js"></script>
    <script src="widget.js"></script>
    <script src="chat.js"></script>
</body>
</html>
