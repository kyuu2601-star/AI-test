<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DalatOS AI - Final Fix</title>
    <style>
        :root { --primary: #28a745; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 10px 15px; border-radius: 18px; line-height: 1.4; font-size: 15px; }
        .user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: white; border: 1px solid #dee2e6; border-bottom-left-radius: 2px; }
        .input-area { background: white; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ced4da; outline: none; }
        button { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #6c757d; }
    </style>
</head>
<body>

<div class="header">🌿 DALATOS AI - STABLE 2026 🌿</div>
<div id="chat-box">
    <div class="msg ai">Chào fen! Tui đã đổi sang Model ổn định nhất. Thử chat lại xem nào!</div>
</div>
<div class="input-area">
    <input type="text" id="prompt" placeholder="Hỏi gì đó đi fen...">
    <button id="sendBtn">Gửi</button>
</div>

<script>
    const API_KEY = "AIzaSyBKG9Fy2-ILdcfYF1ZXgDwNr0AIkKqmWdA"; 
    const chatBox = document.getElementById('chat-box');
    const input = document.getElementById('prompt');
    const btn = document.getElementById('sendBtn');

    async function handleChat() {
        const text = input.value.trim();
        if (!text || btn.disabled) return;

        addMessage('user', text);
        input.value = '';
        btn.disabled = true;

        try {
            // SỬA TẠI ĐÂY: Dùng gemini-flash-latest để Google tự điều phối bản ổn định nhất
            const MODEL = "gemini-flash-latest";
            const URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;

            const response = await fetch(URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();
            
            if (data.error) {
                // Nếu vẫn lỗi Quota, báo cho user biết để đợi
                throw new Error(data.error.message);
            }

            const aiResponse = data.candidates[0].content.parts[0].text;
            addMessage('ai', aiResponse);
        } catch (err) {
            addMessage('ai', "❌ Lỗi hệ thống: " + err.message);
            console.error(err);
        } finally {
            btn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    function addMessage(type, content) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = content;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    btn.addEventListener('click', handleChat);
    input.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleChat(); });
</script>
</body>
</html>
