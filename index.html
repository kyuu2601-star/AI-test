<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DalatOS AI - Cloudflare Proxy</title>
    <style>
        :root { --primary: #007bff; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #1a1a1a; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 12px; border-radius: 15px; font-size: 15px; line-height: 1.5; }
        .user { align-self: flex-end; background: var(--primary); color: white; }
        .ai { align-self: flex-start; background: white; border: 1px solid #ddd; }
        .input-area { background: white; padding: 20px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; outline: none; }
        button { background: var(--primary); color: white; border: none; padding: 0 25px; border-radius: 25px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">🌲 DALATOS AI (SECURE MODE) 🌲</div>
<div id="chat-box">
    <div class="msg ai">Chào fen! Tui đang chạy qua Cloudflare Worker, đố con Bot nào quét được Key của tui đó! 😎</div>
</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Hỏi gì đó đi fen..." onkeypress="if(event.key==='Enter') handleChat()">
    <button onclick="handleChat()">Gửi</button>
</div>

<script>
    async function handleChat() {
    const input = document.getElementById('userInput');
    const userMsg = input.value.trim();
    if (!userMsg || !knowledgeBase) return;

    addMessage('user', userMsg);
    input.value = '';

    // SYSTEM PROMPT: Biến AI thành Thổ Địa
    const systemInstruction = `
Bạn là "Thổ Địa DalatOS" - một chuyên gia du lịch bản địa tại Đà Lạt. 
Nhiệm vụ của bạn là sử dụng dữ liệu CSV dưới đây để tư vấn cho khách du lịch.

QUY TẮC TRẢ LỜI:
1. LUÔN CHECK DỮ LIỆU: Chỉ tư vấn những quán có trong danh sách CSV.
2. TƯ VẤN DI CHUYỂN: Dựa vào cột 'Di chuyển' và 'Lưu ý đường vào' để cảnh báo khách (ví dụ: tay lái yếu thì không nên đi quán có độ khó 'Khó').
3. HÌNH ẢNH: Nếu quán có link ở cột 'Image', hãy hiển thị nó dưới dạng: ![ảnh quán](link_ảnh).
4. LINK MAPS: Luôn cung cấp link Google Maps (cột Link) để khách nhấn vào chỉ đường.
5. LÊN LỘ TRÌNH: Nếu khách yêu cầu lên route, hãy gom các quán cùng 'Khu vực' lại với nhau để khách đi cho tiện.
6. PHONG CÁCH: Thân thiện, nhiệt tình, rành mạch, dùng từ ngữ địa phương như "fen", "đã lắm", "chill"...

DỮ LIỆU CẨM NANG:
${knowledgeBase}
`;

    const fullPrompt = `${systemInstruction}\n\nCÂU HỎI CỦA KHÁCH: "${userMsg}"`;

    const WORKER_URL = "https://ai-test.kyuu2601.workers.dev"; 

    try {
        const response = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: fullPrompt }) 
        });
        const data = await response.json();
        const aiResponse = data.candidates[0].content.parts[0].text;
        
        // Dùng hàm để hiển thị Markdown (để hiện được ảnh và link)
        addMessage('ai', aiResponse);
    } catch (err) {
        addMessage('ai', "❌ Lỗi: " + err.message);
    }
}

    function addMessage(type, content) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = content;
        const chatBox = document.getElementById('chat-box');
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
</body>
</html>
