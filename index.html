<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DalatOS - Thổ Địa Bản Địa</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --primary: #1b5e20; --accent: #fbc02d; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 12px 18px; border-radius: 15px; line-height: 1.6; font-size: 15px; }
        .user { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: white; border: 1px solid #ddd; border-bottom-left-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid #eee; }
        .msg a { color: #d32f2f; font-weight: bold; text-decoration: none; }
        .input-area { background: white; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ccc; outline: none; }
        button { background: var(--accent); border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
        #status { font-size: 10px; text-align: center; color: #999; padding: 5px; }
    </style>
</head>
<body>

<div class="header">🌲 DALATOS - THỔ ĐỊA ĐÀ LẠT</div>
<div id="chat-box">
    <div class="msg ai">Chào fen! Tui là Thổ Địa DalatOS. Fen đang ở đâu hoặc muốn tìm quán gì cứ hú tui, tui soi Maps và cẩm nang rồi chỉ chỗ "ngon - bổ - rẻ" cho nha!</div>
</div>
<div id="status">Đang nạp dữ liệu cẩm nang...</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Hỏi đường, hỏi quán, hỏi review..." onkeypress="if(event.key==='Enter') handleChat()">
    <button onclick="handleChat()">Gửi</button>
</div>

<script>
    let knowledgeBase = "";
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTnXggiUJriOBPHz05pt01aIq_qaCDeQAcWpyYTG6zx1XI9WzfVDTbb8rPwYPf2w8uHxeDpx3Tznx53/pub?gid=615358788&single=true&output=csv";

    window.onload = async () => {
        try {
            const res = await fetch(CSV_URL);
            knowledgeBase = await res.text();
            document.getElementById('status').style.display = 'none';
        } catch (e) { document.getElementById('status').innerText = "Lỗi nạp dữ liệu!"; }
    };

    async function handleChat() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text || !knowledgeBase) return;

        addMessage('user', text);
        input.value = '';

        const systemPrompt = `
Bạn là "Thổ Địa DalatOS" - Chuyên gia hành trình bản địa Đà Lạt. 
Nhiệm vụ của bạn là dẫn dắt khách du lịch dựa trên bộ dữ liệu CSV với các tính năng sau:

1. CHIẾN LƯỢC TÌM KIẾM & LỌC:
- Luôn hỏi "Fen đang ở khu vực nào hoặc sắp tới ở đâu?" để lọc cột B trước khi gợi ý.
- Ưu tiên quán trong bán kính 1km (tính ngầm từ tọa độ cột E). Trước khi gợi ý, phải hỏi: "Fen đi bộ hay đi xe?" để đánh giá sự phù hợp của 1km đó.
- Nếu quán có dấu *Nên thử* trong cột F, hãy ưu tiên đưa lên vị trí số 1 và nhấn mạnh đây là quán "mối" của dân địa phương.

2. GỢI Ý & TƯ VẤN CÓ TÂM:
- Chỉ lấy món ngon từ cột F, tuyệt đối không bịa đặt cảm nhận.
- Nếu có >2 quán cùng loại gần nhau, tóm tắt: "Quán A mạnh về view, Quán B mạnh về đồ ăn" để khách chọn.
- Nhạy bén với tình huống: Nếu khách đi "2 người" chọn chỗ chill, "6 người" chọn chỗ rộng, "2 tiếng" chọn chỗ gần trung tâm.
- Combo khu vực: Khách chọn xong quán Ăn, hãy chủ động: "Gần đó có quán Cafe X (cột B) tiện đường lắm, fen ghé luôn không?"

3. CẢNH BÁO THỰC TẾ (Nhiệm vụ sống còn):
- Đường xá: Luôn soi cột K & M. Hễ thấy chữ "Khó" hoặc "Dốc", phải báo ngay: "Đường này khoai lắm, tay lái cứng hãy đi nha fen".
- Lịch làm việc: Check ngày nghỉ trong cột F. Nếu khách hỏi đúng ngày quán nghỉ, báo ngay để tránh mất công khách.
- Lưu ý: Nhắc khách nếu quán hay đông (theo note cột F) để khách chủ động thời gian.

4. KỸ NĂNG LÊN LỊCH TRÌNH (ROUTE):
- Luôn hỏi câu chốt: "Fen có muốn tui lên lịch trình (route) đi mấy chỗ này cho hợp lý không?"
- Cách lên lịch trình: Gom điểm cùng cột B. Ước tính: Ăn 45p, Uống 30p, Chụp hình 20p + thời gian di chuyển.
- Hỏi khách: "Fen có bao nhiêu tiếng cho chuyến này?" để cân đối số lượng điểm đến.
- Kết thúc lịch trình bằng Recap: "Tổng cộng đi X chỗ, mất khoảng Y tiếng, di chuyển Z km. Chúc fen đi chơi đã đời!".

5. TRẢI NGHIỆM HỘI THOẠI & HIỂN THỊ:
- Ghi nhớ: Khách nói "không ăn cay", "đi 1 mình" thì phải nhớ suốt cuộc trò chuyện để lọc.
- Tối giản: Mặc định chỉ show Tên - Đặc sản - Link Maps. Chỉ show ảnh (cột N) khi khách yêu cầu hoặc chốt quán.
- Ngôn ngữ: Dùng "tui", "fen", thân thiện nhưng quyết đoán khi cảnh báo.
- Tính toán: Tự trừ tọa độ cột E (0.01 lệch ≈ 1.1km) để báo khoảng cách km, không show công thức toán.

DỮ LIỆU CỦA BẠN (Cột A: Tên, B: Khu vực, C: Loại, D: Link, E: Tọa độ, F: Ghi chú/Nên thử/Ngày nghỉ, K: Di chuyển, M: Đường vào, N: Ảnh):
${knowledgeBase}`;

        const WORKER_URL = "https://ai-test.kyuu2601.workers.dev"; // LINK WORKER CỦA FEN

        try {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: systemPrompt + "\n\nKhách: " + text })
            });
            const data = await response.json();
            addMessage('ai', data.candidates[0].content.parts[0].text);
        } catch (err) { addMessage('ai', "Hệ thống bận tí, đợi tui xíu nha fen!"); }
    }

    function addMessage(role, content) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerHTML = role === 'ai' ? marked.parse(content) : content;
        document.getElementById('chat-box').appendChild(div);
        document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
    }
</script>
</body>
</html>
