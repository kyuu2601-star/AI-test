<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DalatOS AI - Trợ Lý Thông Minh</title>
    <style>
        :root { --primary: #1a73e8; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* Khung chat */
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 15px; line-height: 1.5; word-wrap: break-word; }
        .user-msg { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 2px; }
        .ai-msg { align-self: flex-start; background: white; color: #333; border-bottom-left-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        /* Vùng nhập liệu */
        .input-area { background: white; padding: 20px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; transition: border 0.3s; }
        input:focus { border-color: var(--primary); }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #ccc; }

        /* Hiệu ứng gõ máy */
        .typing { font-style: italic; color: #777; font-size: 0.9rem; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

<div class="header">
    <h2>🌲 DalatOS AI 🌲</h2>
</div>

<div id="chat-container">
    <div class="message ai-msg">Chào fen! Tui là AI của DalatOS. Fen muốn hỏi gì nào?</div>
</div>

<div id="typing-indicator" class="typing" style="padding-left: 20px;">AI đang suy nghĩ...</div>

<div class="input-area">
    <input type="text" id="user-input" placeholder="Nhập câu hỏi tại đây..." onkeypress="if(event.key === 'Enter') sendMessage()">
    <button id="send-btn" onclick="sendMessage()">Gửi</button>
</div>

<script>
    // Nhãn này sẽ được GitHub Action thay thế bằng Key thật
    const API_KEY = "AIzaSyBKG9Fy2-ILdcfYF1ZXgDwNr0AIkKqmWdA"; 

    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const container = document.getElementById('chat-container');
        const typingIndicator = document.getElementById('typing-indicator');
        const sendBtn = document.getElementById('send-btn');
        const message = inputField.value.trim();

        if (!message) return;

        // Thêm tin nhắn của user vào màn hình
        appendMessage('user', message);
        inputField.value = '';
        
        // Hiện hiệu ứng đang xử lý
        typingIndicator.style.display = 'block';
        sendBtn.disabled = true;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: message }] }]
                })
            });

            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;
            
            appendMessage('ai', aiText);
        } catch (error) {
            appendMessage('ai', "Lỗi rồi fen ơi! Kiểm tra lại Key hoặc kết nối mạng nha. 😅");
            console.error(error);
        } finally {
            typingIndicator.style.display = 'none';
            sendBtn.disabled = false;
            container.scrollTop = container.scrollHeight;
        }
    }

    function appendMessage(sender, text) {
        const container = document.getElementById('chat-container');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}-msg`;
        msgDiv.innerText = text;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }
</script>

</body>
</html>
