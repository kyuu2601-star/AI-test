<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DalatOS - Thổ Địa Bản Địa</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
</head>
<body>

<div class="header">
    <h1>🌲 DALATOS AI</h1>
    <p>Thổ Địa Chuyên Lên Lịch Trình</p>
</div>

<div id="chat-box"></div>

<div id="status">Đang nạp cẩm nang...</div>

<div class="input-container">
    <input type="text" id="userInput" placeholder="Hỏi quán, hỏi đường, hỏi lịch trình..." onkeypress="if(event.key==='Enter') handleChat()">
    <button onclick="handleChat()">Gửi</button>
</div>

<script src="config.js"></script>
<script src="chat.js"></script>
</body>
</html>
