<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DalatOS AI - Secure Mode</title>
    <style>
        :root { --primary: #6f42c1; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 12px; border-radius: 15px; font-size: 15px; line-height: 1.5; }
        .user { align-self: flex-end; background: var(--primary); color: white; }
        .ai { align-self: flex-start; background: white; border: 1px solid #ddd; }
        .input-area { background: white; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 10px 15px; border-radius: 25px; border: 1px solid #ccc; outline: none; }
        button { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 25px; cursor: pointer; }
        .key-btn { background: #6c757d; font-size: 10px; padding: 5px 10px; position: absolute; top: 15px; right: 10px; }
    </style>
</head>
<body>

<div class="header">🌲 DALATOS AI - SECURE 🌲</div>
<button class="key-btn" onclick="resetKey()">Đổi API Key</button>

<div id="chat-box"></div>

<div class="input-area">
    <input type="text" id="promptInput" placeholder="Nhập tin nhắn...">
    <button onclick="handleChat()">Gửi</button>
</div>

<script>
    // 1. Kiểm tra Key trong máy người dùng (LocalStorage)
    let API_KEY = localStorage.getItem('GEMINI_KEY');

    function checkKey() {
        if (!API_KEY || API_KEY === "null") {
            API_KEY = prompt("Vui lòng dán API Key của fen vào đây (Chỉ lưu tại máy fen):");
            if (API_KEY) {
                localStorage.setItem('GEMINI_KEY', API_KEY);
            }
        }
    }

    function resetKey() {
        localStorage.removeItem('GEMINI_KEY');
        location.reload();
    }

    async function handleChat() {
        checkKey(); // Đảm bảo có key trước khi gửi
        if (!API_KEY) return;

        const input = document.getElementById('promptInput');
        const text = input.value.trim();
        if (!text) return;

        addMessage('user', text);
        input.value = '';

        try {
            const MODEL = "gemini-1.5-flash";
            const URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;

            const response = await fetch(URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message);

            addMessage('ai', data.candidates[0].content.parts[0].text);
        } catch (err) {
            addMessage('ai', "❌ Lỗi: " + err.message);
            if (err.message.includes("API key not valid")) resetKey();
        }
    }

    function addMessage(type, content) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = content;
        document.getElementById('chat-box').appendChild(div);
        document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
    }

    checkKey(); // Hỏi key ngay khi mở trang
</script>
</body>
</html>
