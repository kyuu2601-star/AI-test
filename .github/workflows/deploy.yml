name: Deploy DalatOS AI
on:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Dùng cách này an toàn hơn sed: thay trực tiếp nội dung file
      - name: Replace Placeholder with Real Key
        env:
          REAL_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Kiểm tra xem file có tồn tại không trước khi làm
          if [ -f "AI-test/index.html" ]; then
            # Thay thế chính xác nhãn __API_KEY_PLACEHOLDER__ bằng giá trị trong Secret
            perl -i -pe "s/__API_KEY_PLACEHOLDER__/$REAL_KEY/g" AI-test/index.html
            echo "Đã tiêm Key thành công vào AI-test/index.html"
          else
            echo "LỖI: Không tìm thấy file tại đường dẫn AI-test/index.html"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .        # Đẩy toàn bộ folder lên
          branch: gh-pages
