name: Deploy DalatOS AI
on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Replace Placeholder with Real Key
        env:
          REAL_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Tìm tất cả các file .html và thay thế nhãn placeholder bằng Key thật
          # Cách này chấp hết mọi loại folder hoa hay thường
          find . -name "*.html" -exec perl -i -pe "s/__API_KEY_PLACEHOLDER__/\$ENV{REAL_KEY}/g" {} +
          echo "✅ Đã quét và tiêm Key vào toàn bộ file HTML tìm thấy!"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
