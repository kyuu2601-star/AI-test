name: Deploy DalatOS AI
on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject API Key
        env:
          G_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Dùng dấu @ làm phân cách để Key có dấu / cũng không bị lỗi
          # Tìm file index.html và thay TẤT CẢ các loại nhãn nghi ngờ
          
          find . -name "index.html" -exec sed -i "s@GEMINI_API_KEY@$G_KEY@g" {} +
          find . -name "index.html" -exec sed -i "s@__API_KEY_PLACEHOLDER__@$G_KEY@g" {} +
          
          echo "✅ Đã tiêm mã thành công!"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . 
          branch: gh-pages
          clean: true
