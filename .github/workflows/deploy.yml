name: Deploy DalatOS AI
on:
  push:
    branches: [ main ] # Kiểm tra lại nếu nhánh của fen là 'master' thì sửa chữ này
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject API Key
        run: |
          # Dùng dấu @ để tránh xung đột với ký tự / trong Key
          # Thêm tùy chọn -i để ghi đè trực tiếp vào file
          sed -i "s@__API_KEY_PLACEHOLDER__@${{ secrets.GEMINI_API_KEY }}@g" index.html
          
          # Kiểm tra xem đã thay thế chưa (Nếu hiện '__API_KEY_PLACEHOLDER__' là fail)
          echo "Dòng chứa Key sau khi thay thế:"
          grep "const API_KEY =" index.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
