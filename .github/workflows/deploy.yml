name: Deploy DalatOS AI
on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject API Key
        # Dùng biến môi trường trung gian để bảo mật và tránh lỗi ký tự đặc biệt
        env:
          G_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Kiểm tra nếu Secret bị rỗng thì báo lỗi đỏ ngay tại đây
          if [ -z "$G_KEY" ]; then
            echo "❌ LỖI: Không lấy được Secret GEMINI_API_KEY. Kiểm tra lại tên Secret trong Settings!"
            exit 1
          fi

          # 2. Dùng nháy kép "" để shell bốc đúng giá trị thật của $G_KEY
          # Quét tất cả file index.html để thay thế nhãn
          find . -name "index.html" -exec sed -i "s/GEMINI_API_KEY/$G_KEY/g" {} +
          find . -name "index.html" -exec sed -i "s/__API_KEY_PLACEHOLDER__/$G_KEY/g" {} +
          
          echo "✅ Đã tiêm Key thật vào code thành công!"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: AI-test   # Chỉ đẩy nội dung trong AI-test lên web
          branch: gh-pages
          clean: true
